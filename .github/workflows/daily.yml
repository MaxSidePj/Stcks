name: Daily company check

on:
  schedule:
    - cron: "15 6-20/2 * * 1-5"
    - cron: "15 8 * * 0,6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - companies.txt
      - config.json
      - requirements.txt
      - "*.py"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install trusted certificate bundle
        run: python -m pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: cache
          key: pulse-cache-${{ github.run_id }}
          restore-keys: pulse-cache-

      - name: Run CompanyPulse
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: python pulse.py

      - name: Save state
        id: state
        shell: bash
        run: |
          set -euo pipefail

          checked_head=$(git rev-parse HEAD)
          git fetch --no-tags --depth=1 origin main
          latest_head=$(git rev-parse FETCH_HEAD)

          if [ "$checked_head" != "$latest_head" ]; then
            echo "::notice::Newer commits arrived. Skipping outdated results. Start a new workflow run on main."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "companypulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state

          if ! git diff --cached --quiet; then
            git commit -m "Update state $(date -u '+%F %H:%M')"
            git push origin HEAD:main
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
        if: steps.state.outputs.publish == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.state.outputs.publish == 'true'
        with:
          path: site

      - id: deploy
        if: steps.state.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
